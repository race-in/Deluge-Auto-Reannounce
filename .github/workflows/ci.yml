name: CI
on:
  push:
    branches: [main, '**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n install.sh uninstall.sh scripts/reannounce-new.sh tests/test-runner.sh
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh scripts/reannounce-new.sh tests/test-runner.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/configure-execute.py
      - name: Mock runner tests
        run: bash tests/test-runner.sh
